services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartllm-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=data/smartllm.db
      - PROVIDER_MODE=mock
      - APP_ENV=development
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/platform-info')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - smartllm-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartllm-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartllm-network
    restart: unless-stopped

networks:
  smartllm-network:
    driver: bridge
