[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "smartllm-platform"
version = "0.2.0"
description = "Smart LLM Optimizer — live, documents and usage platform"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.21,<1", "alembic>=1.15,<2",
  "pwdlib[argon2]>=0.2,<1", "typer>=0.15,<1",
  "openai>=2,<3", "tiktoken>=0.12,<1","llmlingua", "numpy>=2,<3",
  "pypdf>=6,<7", "python-docx>=1.2,<2", "python-multipart>=0.0.22,<1", "tzdata>=2025",
  "scikit-learn>=1.6,<1.8", "jsonschema==4.26.0"
]

[project.optional-dependencies]
router_ml = ["onnxruntime==1.22.1", "onnx==1.18.0", "tokenizers==0.21.4", "torch==2.6.0"]
router_data = ["pyarrow==19.0.1"]
dev = ["hatchling>=1.27,<2", "editables>=0.5,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1",
       "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
