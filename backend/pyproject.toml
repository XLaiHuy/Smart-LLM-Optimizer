[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "smartllm-platform"
version = "0.1.0"
description = "Smart LLM Optimizer — G0 mock foundation"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy[asyncio]>=2.0,<2.1",
  "aiosqlite>=0.21,<1", "alembic>=1.15,<2",
  "pwdlib[argon2]>=0.2,<1", "typer>=0.15,<1"
]

[project.optional-dependencies]
dev = ["hatchling>=1.27,<2", "editables>=0.5,<1", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1",
       "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
